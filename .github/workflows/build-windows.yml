name: Build Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Stamp Control version from CMakeLists (single source of truth)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cmake = Get-Content server/CMakeLists.txt -Raw
          if ($cmake -notmatch 'project\(ArtLightServer\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)') {
            throw "Could not read project VERSION from server/CMakeLists.txt"
          }
          $version = $Matches[1]
          Write-Host "Stamping ArtLight Control version $version (from server/CMakeLists.txt)"

          # csproj: Version / AssemblyVersion / FileVersion
          $csproj = 'control/ArtLightControl/ArtLightControl.csproj'
          (Get-Content $csproj -Raw) `
            -replace '<Version>[^<]*</Version>', "<Version>$version</Version>" `
            -replace '<AssemblyVersion>[^<]*</AssemblyVersion>', "<AssemblyVersion>$version.0</AssemblyVersion>" `
            -replace '<FileVersion>[^<]*</FileVersion>', "<FileVersion>$version.0</FileVersion>" |
            Set-Content $csproj -NoNewline

          # Installer.iss: MyAppVersion define
          $iss = 'control/Installer.iss'
          (Get-Content $iss -Raw) `
            -replace '#define MyAppVersion "[^"]*"', "#define MyAppVersion `"$version`"" |
            Set-Content $iss -NoNewline

          Write-Host "Stamped csproj + Installer.iss to $version"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish ArtLightControlService (win-x64)
        working-directory: control
        run: dotnet publish ArtLightControlService\ArtLightControlService.csproj -c Release -r win-x64 --self-contained false -o ArtLightControlService\bin\x64\Release\net8.0-windows\win-x64

      - name: Publish ArtLightControl (win-x64)
        working-directory: control
        run: dotnet publish ArtLightControl\ArtLightControl.csproj -c Release -r win-x64 --self-contained false -o ArtLightControl\bin\x64\Release\net8.0-windows10.0.19041.0\win-x64

      - name: Install Inno Setup 7 (SetupArchitecture needs 7+)
        shell: pwsh
        run: |
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\innosetup7.exe"
          Start-Process -FilePath "$env:TEMP\innosetup7.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup 7\ISCC.exe", "C:\Program Files\Inno Setup 7\ISCC.exe", "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          Write-Host "Using ISCC: $($iscc.FullName)"
          & $iscc.FullName control\Installer.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArtLightControl-installer
          path: control/Output/*.exe
          if-no-files-found: error
