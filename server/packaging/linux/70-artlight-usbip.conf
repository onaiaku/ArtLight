# The kernel half of USB/IP on the importer.
#
# vhci-hcd provides the virtual host controller that an attached remote device appears on. Without
# it `usbip attach` has nowhere to put the device and fails; the kernel packages ship the module but
# nothing loads it, so a fresh machine does not have it and USB device sharing cannot work.
#
# The module is safe to load unconditionally: it attaches nothing by itself and only exists to be a
# target for an attach that a user has explicitly asked for.
vhci-hcd
